# Example project binding for SAP AI Factory (copy to config.yaml and edit).
# Secrets never live here — only names of out-of-tree credential sessions and project keys.

# Jira project key used by backlog-drafting / defect write-back comments
jira_project: EPMCSAPAI

# Destination names for ~/.config/mcp-*/sessions/<name>.env
jira_destination: default
abap_destination: default

# Active domain packs (under knowledge/domain-packs/)
domain_packs:
  - order-to-cash

# Connectors to wire into .mcp.json via `make setup-mcp`
connectors:
  - jira
  - abap-mcp

# Default write policy for MCP mutations (skills must still require explicit --apply)
apply_writes_default: false
