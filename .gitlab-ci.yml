# Manual-trigger pipeline for client artifact packaging (EPMCSAPAI-306).
#
# Status: partial. The `package` job calls scripts/package_client_artifacts.py (EPMCSAPAI-300).
# The `lint-dependencies` job now calls the real scripts/lint_dependencies.py (EPMCSAPAI-299), but
# only hard-fails on a missing skill.meta.md file -- its full check (comparing each skill's
# Dependency graph table against real SKILL.md references) still runs and prints, but doesn't
# fail the job (no --strict) yet. Two reasons: that table is still being built out under
# EPMCSAPAI-291 (Igor Kochuev's own status update there lists "build correct dependency graphs"
# as an open item), and one direction of the comparison has a known false-positive source (see
# scripts/lint_dependencies.py's own docstring). Hard-failing CI on WIP, partly-noisy data would be
# premature -- revisit --strict once 291's tables settle.
#
# All CI scripts live under scripts/, not tools/ (tools/ is an empty, stale placeholder for the
# per-tool adapter scaffolding described in CLAUDE.md, unrelated to these pipeline scripts).
#
# Variable naming: this ticket's own acceptance criteria name INCLUDED_AGENTS and INCLUDED_FLOWS.
# This factory's actual vocabulary is skills/connectors/activities, not "agents" (a distinct,
# narrower component kind here) or "flows" (not a concept this factory uses at all). Mapped
# INCLUDED_AGENTS -> --skills and INCLUDED_FLOWS -> --activity as the closest existing concepts;
# flagged this mismatch back to the ticket rather than silently reinterpreting it -- confirm or
# correct the mapping if it's wrong.
#
# `check-mr-approvals`: GitLab Free has no native "required approvers" MR rule (Premium/Ultimate
# only), so this job substitutes for it -- see scripts/check_mr_approvals.py for the approver
# lookup and self-approval handling. For this job's failure to actually block a merge, `main`'s
# protected-branch settings must also require "Pipelines must succeed"; that plus two project
# CI/CD variables (Settings -> CI/CD -> Variables, not declared below since they're project
# config, not per-run pipeline input) are one-time project setup this file can't do on its own:
#   - MR_APPROVAL_CHECK_TOKEN: masked, protected, a token with read_api scope.
#   - MR_REQUIRED_APPROVERS: comma-separated list of required-approver GitLab usernames
#     (matching is case-insensitive), e.g. "alice,bob,carol".

stages:
  - validate
  - package

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

# Top-level, not per-job: the description/value object form only renders as a prompt in
# GitLab's "Run Pipeline" web UI when declared here. All jobs below inherit these as plain
# environment variables automatically -- no per-job re-declaration needed.
variables:
  INCLUDED_AGENTS:
    description: "Comma-separated skill names to bundle (this factory's 'skills', not its own, narrower 'Agent' component kind), or '*' for all own-posture skills."
    value: ""
  INCLUDED_FLOWS:
    description: "Comma-separated Delivery-pipeline activity titles in scope for the client (repeatable in the underlying tool as --activity; provide one here, or extend this job if a real engagement needs more than one)."
    value: ""
  CLIENT_NAME:
    description: "Identifier used to name the generated archive (client-artifacts-<name>.zip)."
    value: ""
  DRY_RUN:
    description: "If 'true', validates the selection and reports what would be packaged without producing an archive."
    value: "false"

lint-dependencies:
  stage: validate
  image: python:3.11-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - python3 scripts/lint_dependencies.py
  allow_failure: false

check-mr-approvals:
  stage: validate
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  script:
    - python3 scripts/check_mr_approvals.py
  allow_failure: false

package:
  stage: package
  image: python:3.11-slim
  rules:
    - if: '$CLIENT_NAME == ""'
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - |
      if [ -z "$CLIENT_NAME" ]; then
        echo "CLIENT_NAME is required." >&2
        exit 1
      fi
      ARGS="--client-name $CLIENT_NAME"
      if [ -n "$INCLUDED_AGENTS" ]; then ARGS="$ARGS --skills $INCLUDED_AGENTS"; else ARGS="$ARGS --skills ''"; fi
      if [ -n "$INCLUDED_FLOWS" ]; then ARGS="$ARGS --activity \"$INCLUDED_FLOWS\""; fi
      if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
      echo "Running: python3 scripts/package_client_artifacts.py $ARGS --out-dir dist"
      eval "python3 scripts/package_client_artifacts.py $ARGS --out-dir dist"
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 30 days
    when: on_success
