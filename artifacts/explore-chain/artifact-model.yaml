# Explore-chain artifact model + handoffs
#
# Machine-readable ownership map for the Explore happy path
# (requirements-intake → fit-to-standard → solution-design → backlog-drafting).
# Inspired by ai-sdlc artifact-model.yaml; Activate content and schemas stay in
# sibling artifact folders (design-record, sign-off-record, …).

version: 1
chain: explore
system_of_record:
  working_documents: workspace      # gitignored run folders; promote to client SoR on --apply
  decision_log: knowledge/process   # signed FTS outcomes land here when project uses the bucket
  work_intent: jira                 # backlog items; cloud-alm when wired
  local_drafts: ephemeral

promotion:
  write_policy: draft-locally-then-promote-on-apply
  apply_flag: "--apply"
  dry_run_default: true

status_gate:
  # Downstream Realize build skills and backlog Jira create require this:
  design_record_status_required: APPROVED
  allowed_design_statuses:
    - DRAFT
    - IN_REVIEW
    - APPROVED
    - REOPENED
  reopen_path: REOPENED  # never silently reset APPROVED → DRAFT

artifacts:
  - id: requirements-record
    name: Normalized requirements
    producer: requirements-intake
    template: artifacts/requirements-record/template.md
    schema: artifacts/requirements-record/schema.json
    system_of_record: workspace
    required_for_gate: false
    downstream_consumers:
      - fit-to-standard
      - solution-design  # Mode B cite only
    handoff: handoff.md#requirements-to-fts

  - id: fts-decision-log
    name: Fit-to-standard decision log
    producer: fit-to-standard
    template: skills/fit-to-standard/references/decision-log-template.md
    system_of_record: workspace
    id_scheme: "FTS-<date>-<process-slug>-row-NN"
    required_for_gate: true
    paired_with: sign-off-record
    downstream_consumers:
      - solution-design
      - backlog-drafting
      - defect-triage
    handoff: handoff.md#fts-to-design

  - id: sign-off-record
    name: Workshop / decision sign-off
    producer: fit-to-standard
    template: artifacts/sign-off-record/template.md
    schema: artifacts/sign-off-record/schema.json
    system_of_record: workspace
    required_for_gate: true
    note: "Counts toward explore→realize only when Session status is Live"

  - id: design-record
    name: Target design
    producer: solution-design
    template: artifacts/design-record/template.md
    schema: artifacts/design-record/schema.json
    system_of_record: workspace
    status_field: status
    required_for_gate: true
    gate_value: APPROVED
    downstream_consumers:
      - backlog-drafting
      - config-doc
      - abap-dev
      - test-case-design
    handoff: handoff.md#design-to-backlog

  - id: extensibility-record
    name: Extensibility tier decision
    producer: solution-design
    template: artifacts/extensibility-record/template.md
    schema: artifacts/extensibility-record/schema.json
    system_of_record: workspace
    required_for_gate: true
    paired_with: design-record
    downstream_consumers:
      - backlog-drafting

  - id: backlog-work-item
    name: Traceable work item
    producer: backlog-drafting
    template: skills/backlog-drafting/references/work-item-template.md
    system_of_record: jira
    required_for_gate: true
    backlink_chain:
      - fts-decision-log.row_id
      - design-record
      - extensibility-record
    write_policy: preview-then-apply
    handoff: handoff.md#backlog-to-realize

owners:
  requirements-intake: functional
  fit-to-standard: functional
  solution-design: architect
  backlog-drafting: delivery

q_gate: explore→realize
